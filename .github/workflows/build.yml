name: Build

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: >
          OpenWrt version (Note: latest means build against latest release, not latest commit)
        required: true
        default: 'latest'

      target:
        description: 'Platform Target'
        required: true
        default: 'x86'

      subtarget:
        description: 'Platform Subtarget'
        required: true
        default: '64'


# ─── Global defaults ─────────────────────────────────────────────────────────
defaults:
  run:
    shell: bash

jobs:
  # ── 1. Resolve "latest" to a concrete version tag ──────────────────────────
  resolve-version:
    name: Resolve OpenWrt version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Resolve version tag
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.openwrt_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${INPUT_VERSION}" == "latest" ]]; then
            VERSION=$(gh release view --repo openwrt/openwrt --json tagName -q '.tagName' | sed 's/^v//')
            echo "Resolved 'latest' → ${VERSION}"
          else
            # Strip a leading 'v' if the user included one
            VERSION="${INPUT_VERSION#v}"
          fi

          # Basic sanity-check: must look like X.Y.Z
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '${VERSION}' does not match expected X.Y.Z format."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # ── 2. Build the package ───────────────────────────────────────────────────
  build:
    name: Build opensoho (${{ needs.resolve-version.outputs.version }} · ${{ inputs.target }}/${{ inputs.subtarget }})
    needs: resolve-version
    runs-on: ubuntu-22.04

    env:
      OPENWRT_VERSION: ${{ needs.resolve-version.outputs.version }}
      TARGET:          ${{ inputs.target }}
      SUBTARGET:       ${{ inputs.subtarget }}
      PKG_NAME:        opensoho

    steps:
      # ── 2a. Validate minimum OpenWrt version ─────────────────────────────
      # APK (the only supported format) requires OpenWrt 24.10+.
      - name: Validate minimum OpenWrt version
        run: |
          MAJOR=$(echo "${OPENWRT_VERSION}" | cut -d. -f1)
          MINOR=$(echo "${OPENWRT_VERSION}" | cut -d. -f2)
          if (( MAJOR < 24 )) || ( (( MAJOR == 24 )) && (( MINOR < 10 )) ); then
            echo "::error::This package requires OpenWrt 24.10 or newer (got ${OPENWRT_VERSION})."
            exit 1
          fi

      # ── 2b. Host build dependencies ───────────────────────────────────────
      - name: Install host build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-distutils \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl jq

      # ── 2c. Discover the SDK tarball URL ──────────────────────────────────
      - name: Discover SDK download URL
        id: sdk
        run: |
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}"

          # The HTML listing contains the SDK filename; grep for it.
          LISTING=$(curl -fsSL "${BASE}/")

          SDK_FILE=$(echo "${LISTING}" \
            | grep -oP 'openwrt-sdk-[^"<>\s]+\.tar\.(xz|zst)' \
            | head -1)

          if [[ -z "${SDK_FILE}" ]]; then
            echo "::error::No SDK tarball found at ${BASE}/"
            echo "Listing snippet:"
            echo "${LISTING}" | grep -i sdk || echo "(nothing matched)"
            exit 1
          fi

          echo "sdk_url=${BASE}/${SDK_FILE}"   >> "$GITHUB_OUTPUT"
          echo "sdk_file=${SDK_FILE}"           >> "$GITHUB_OUTPUT"
          # Strip both .tar.xz and .tar.zst for the directory name
          SDK_DIR="${SDK_FILE%.tar.*}"
          SDK_DIR="${SDK_DIR%.tar}"
          echo "sdk_dir=${SDK_DIR}"             >> "$GITHUB_OUTPUT"
          echo "Found SDK: ${SDK_FILE}"

      # ── 2d. Cache the extracted SDK ───────────────────────────────────────
      - name: Cache SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: sdk/
          # Key includes the exact SDK filename, which encodes version + gcc ver
          key: sdk-${{ steps.sdk.outputs.sdk_file }}

      - name: Download & extract SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ steps.sdk.outputs.sdk_url }}" -O sdk_download

          mkdir -p sdk
          tar -xf sdk_download --strip-components=1 -C sdk
          rm sdk_download

      # ── 2e. Check out the current repo so feeds can reference it ──────────
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: src/openwrt-opensoho

      # ── 2f. Install Go on the runner ──────────────────────────────────────
      # OpenWrt uses the host Go as the first link in its bootstrap chain
      # (GOROOT_BOOTSTRAP), which speeds up the cache-miss case.
      # On cache hits this step is near-instant anyway.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      # ── 2g. Configure feeds ───────────────────────────────────────────────
      - name: Set up feeds
        working-directory: sdk
        run: |
          # Rewrite feeds.conf.default to only the feeds we actually need:
          #   packages     — provides golang/host (build dependency)
          #   opensoho_pkg — our package, via src-link into the local checkout
          #
          # Preserve the pinned commit from the SDK's original file so package
          # versions stay aligned with this OpenWrt release.
          grep -E '^src-(git|gz) packages ' feeds.conf.default \
            > feeds.conf.default.new
          echo "src-link opensoho_pkg ${{ github.workspace }}/src/openwrt-opensoho" \
            >> feeds.conf.default.new
          mv feeds.conf.default.new feeds.conf.default

          ./scripts/feeds update packages opensoho_pkg
          ./scripts/feeds install golang
          ./scripts/feeds install -a -p opensoho_pkg

      # ── 2h. Generate .config ──────────────────────────────────────────────
      - name: Configure build
        working-directory: sdk
        run: |
          # Use the runner's Go as the initial bootstrap compiler so the
          # golang/host build (when it does run) skips downloading a bootstrap.
          GOROOT="$(go env GOROOT)"
          echo "CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT=\"${GOROOT}\"" >> .config

          echo "CONFIG_PACKAGE_${PKG_NAME}=m" >> .config
          echo "CONFIG_USE_APK=y" >> .config

          make defconfig 2>&1 | grep -v "^#" | head -20 || true

      # ── 2i. Cache the golang/host toolchain ───────────────────────────────
      # OpenWrt always builds its own pinned Go version from source; there is no
      # skip flag.  GOLANG_EXTERNAL_BOOTSTRAP_ROOT only sets the *initial*
      # bootstrap compiler — it does not bypass the full 1.17→1.20→1.22→1.24
      # build chain.  Caching the compiled output is the only reliable way to
      # avoid that 7-10 minute step on every run.
      #
      # Key on the SDK filename: it encodes the OpenWrt release, target,
      # subtarget, and host GCC version, which together uniquely determine the
      # golang/host output.
      - name: Cache golang host toolchain
        id: cache-golang-host
        uses: actions/cache@v4
        with:
          path: |
            sdk/build_dir/hostpkg/go-*/
            sdk/staging_dir/host/lib/go-*/
            sdk/staging_dir/host/bin/go
            sdk/staging_dir/host/bin/gofmt
          key: golang-host-${{ steps.sdk.outputs.sdk_file }}

      - name: Build golang host toolchain
        if: steps.cache-golang-host.outputs.cache-hit != 'true'
        working-directory: sdk
        run: |
          echo "golang/host not cached — building (this takes 7-10 min, cached on next run)"
          make package/golang/host/compile V=s -j$(nproc) 2>&1 | tee /tmp/golang-host.log

          if [[ ${PIPESTATUS[0]} -ne 0 ]]; then
            echo "::error::golang/host build failed — last 60 lines:"
            tail -60 /tmp/golang-host.log
            exit 1
          fi

      # ── 2j. Build opensoho ────────────────────────────────────────────────
      - name: Build opensoho package
        working-directory: sdk
        run: |
          make "package/${PKG_NAME}/compile" \
               V=s \
               -j$(nproc) \
               2>&1 | tee /tmp/build.log

          if [[ ${PIPESTATUS[0]} -ne 0 ]]; then
            echo "::error::Build failed — last 60 lines of log:"
            tail -60 /tmp/build.log
            exit 1
          fi

      # ── 2k. Collect artifacts ─────────────────────────────────────────────
      - name: Collect built packages
        id: collect
        run: |
          mkdir -p artifacts

          find sdk/bin/packages -name "*.apk" | while read -r f; do
            cp -v "$f" artifacts/
          done

          COUNT=$(ls artifacts/ | wc -l)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

          if [[ "${COUNT}" -eq 0 ]]; then
            echo "::error::No .apk files found under sdk/bin/packages/"
            find sdk/bin/ -type f | head -20
            exit 1
          fi

          echo "Built packages:"
          ls -lh artifacts/

      # ── 2l. Upload ────────────────────────────────────────────────────────
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: >-
            opensoho_${{ env.OPENWRT_VERSION }}_${{ inputs.target }}_${{ inputs.subtarget }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      # ── 2m. Job summary ───────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## opensoho build result

          | Field          | Value |
          |----------------|-------|
          | OpenWrt version | \`${OPENWRT_VERSION}\` |
          | Target          | \`${TARGET}/${SUBTARGET}\` |
          | Packages built  | \`${{ steps.collect.outputs.count }}\` |

          $(ls artifacts/ 2>/dev/null | sed 's/^/- `/' | sed 's/$/`/')
          EOF